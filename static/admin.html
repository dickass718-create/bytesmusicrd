<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#03100c">
<title>BytesMusic — Admin Panel</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#020907; --bg2:#03110d; --bg3:#051712;
  --border:#12352d; --border2:#185342;
  --mint:#12e7b0; --mint-d:#0dbf94; --mint-bg:rgba(18,231,176,.08);
  --text:#edf9f4; --text2:#78958c; --text3:#557b72;
  --danger:#ff6b7e; --warn:#ffb86c; --info:#5b9eff;
  --radius:14px;
}
html,body{background:var(--bg);color:var(--text);font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif}
button,input{font:inherit;outline:none;border:none}
button{cursor:pointer;background:none;color:inherit}
a{color:var(--mint);text-decoration:none}

.layout{display:grid;grid-template-columns:260px 1fr;min-height:100vh}

/* Sidebar */
.sidebar{border-right:1px solid var(--border);background:var(--bg2);padding:24px 16px;display:flex;flex-direction:column}
.sidebar .brand{display:flex;gap:14px;align-items:center;margin:8px 4px 36px}
.sidebar .mark{width:48px;height:48px;border:1.5px solid var(--mint);border-radius:13px;display:grid;place-items:center;color:var(--mint);font-weight:800;font-size:18px}
.sidebar .brand b{font-size:19px;letter-spacing:-.5px}
.sidebar .brand small{display:block;color:#6d8980;font:9px monospace;letter-spacing:2px;margin-top:4px}
.snav{display:grid;gap:4px;flex:1}
.snav button{color:var(--text2);text-align:left;padding:13px 16px;border-radius:var(--radius);font-size:16px;transition:all .2s;display:flex;align-items:center;gap:12px}
.snav button:hover{background:#073229;color:var(--mint)}
.snav button.active{background:#073229;color:var(--mint)}
.snav .ico{font-size:18px;width:22px;text-align:center}
.sback{color:var(--text2);border:1px solid var(--border2);border-radius:var(--radius);padding:13px 16px;font-size:15px;transition:all .2s;text-align:center}
.sback:hover{background:var(--mint-bg);color:var(--mint)}

/* Main */
.main{min-width:0;display:flex;flex-direction:column}
.topbar{height:72px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:18px;padding:0 28px;position:sticky;top:0;background:rgba(2,9,7,.93);backdrop-filter:blur(14px);z-index:5}
.topbar h1{font-size:22px;font-weight:700}
.topbar .spacer{flex:1}
.topbar .stat-pill{display:flex;align-items:center;gap:8px;color:var(--mint);font-size:13px;font-weight:600}
.topbar .dot{width:8px;height:8px;border-radius:50%;background:var(--mint);box-shadow:0 0 8px var(--mint);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.topbar .admin-badge{background:var(--mint-bg);border:1px solid var(--border2);border-radius:8px;padding:6px 12px;font-size:12px;color:var(--mint);font-weight:600}

.content{padding:28px;overflow:auto;flex:1}
.page{display:none}
.page.active{display:block}

/* Stat cards */
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px;margin-bottom:32px}
.stat{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:20px;transition:border-color .2s}
.stat:hover{border-color:var(--border2)}
.stat .label{font:10px monospace;letter-spacing:2px;color:var(--text3);margin-bottom:8px}
.stat .value{font-size:32px;font-weight:800;color:var(--mint)}
.stat .sub{font-size:13px;color:var(--text2);margin-top:6px}

/* Section */
.section{margin-bottom:32px}
.section h2{font-size:20px;margin-bottom:16px;display:flex;align-items:center;gap:10px}
.section h2 .count{font-size:13px;color:var(--text3);font-weight:400}

/* Table */
.table{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.table table{width:100%;border-collapse:collapse}
.table th{text-align:left;padding:14px 16px;font:10px monospace;letter-spacing:2px;color:var(--text3);border-bottom:1px solid var(--border)}
.table td{padding:14px 16px;border-bottom:1px solid #0e3028;font-size:14px}
.table tr:last-child td{border-bottom:none}
.table tr:hover td{background:rgba(18,231,176,.03)}
.table .thumb{width:40px;height:40px;border-radius:8px;object-fit:cover;background:#08251e}
.table .uname{font-weight:600}
.table .uemail{color:var(--text2);font-size:12px;margin-top:2px}
.table .badge{display:inline-block;padding:3px 8px;border-radius:6px;font-size:11px;font-weight:600}
.badge.admin{background:var(--mint-bg);color:var(--mint);border:1px solid var(--border2)}
.badge.user{background:rgba(255,255,255,.05);color:var(--text2)}
.btn-del{color:var(--danger);border:1px solid rgba(255,107,126,.3);border-radius:8px;padding:6px 12px;font-size:12px;transition:all .2s}
.btn-del:hover{background:rgba(255,107,126,.1)}
.btn-del:disabled{opacity:.4;cursor:not-allowed}

/* Chart */
.chart{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:24px;margin-bottom:32px}
.chart h3{font-size:14px;color:var(--text2);margin-bottom:20px}
.bars{display:flex;align-items:flex-end;gap:8px;height:160px}
.bar{flex:1;background:linear-gradient(180deg,var(--mint),var(--mint-d));border-radius:6px 6px 0 0;min-height:4px;transition:height .5s ease;position:relative}
.bar:hover{opacity:.85}
.bar .tip{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);font-size:11px;color:var(--mint);margin-bottom:6px;white-space:nowrap}

/* Login */
.login-wrap{display:grid;place-items:center;min-height:100vh;padding:20px}
.login-card{width:min(440px,92vw);background:var(--bg2);border:1px solid var(--border2);border-radius:20px;padding:36px;box-shadow:0 25px 80px #000}
.login-card .mark{width:54px;height:54px;border:1.5px solid var(--mint);border-radius:15px;display:grid;place-items:center;color:var(--mint);font-weight:800;font-size:20px;margin:0 auto 20px}
.login-card h1{text-align:center;font-size:24px;margin-bottom:8px}
.login-card p{text-align:center;color:var(--text2);font-size:14px;margin-bottom:24px}
.login-card .field{width:100%;margin:9px 0;padding:15px;border:1px solid #185342;background:#02140f;color:#fff;border-radius:10px;transition:border-color .2s}
.login-card .field:focus{border-color:var(--mint)}
.login-card .action{width:100%;margin-top:12px;padding:15px;border:0;border-radius:10px;background:var(--mint);color:#00150e;font-weight:800;transition:all .2s}
.login-card .action:hover{background:var(--mint-d)}
.login-card .msg{color:var(--danger);margin-top:12px;font-size:13px;text-align:center}
.login-card .back{text-align:center;margin-top:16px}
.login-card .back a{color:var(--text2);font-size:14px}
.login-card .back a:hover{color:var(--mint)}

::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#12483b;border-radius:3px}

@media(max-width:768px){
  .layout{grid-template-columns:1fr}
  .sidebar{position:fixed;bottom:0;left:0;right:0;height:64px;border:0;border-top:1px solid var(--border);flex-direction:row;align-items:center;padding:0 12px;z-index:30}
  .sidebar .brand{display:none}
  .snav{display:flex;gap:0;flex:1;justify-content:space-around}
  .snav button{padding:10px;font-size:0}
  .snav button .ico{font-size:22px}
  .snav button span:not(.ico){display:none}
  .sback{display:none}
  .content{padding:16px;padding-bottom:80px}
  .topbar{padding:0 16px}
  .topbar .stat-pill,.topbar .admin-badge{display:none}
  .stats{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>
<body>

<!-- Login -->
<div class="login-wrap" id="loginWrap">
  <div class="login-card">
    <div class="mark">BM</div>
    <h1>Admin Access</h1>
    <p>Sign in with your admin account to continue.</p>
    <input id="loginUser" class="field" placeholder="username">
    <input id="loginPass" class="field" type="password" placeholder="password" onkeydown="if(event.key==='Enter')adminLogin()">
    <button class="action" onclick="adminLogin()">SIGN IN</button>
    <div id="loginMsg" class="msg"></div>
    <div class="back"><a href="/">← Back to BytesMusic</a></div>
  </div>
</div>

<!-- Panel -->
<div class="layout" id="panel" style="display:none">
  <aside class="sidebar">
    <div class="brand">
      <div class="mark">BM</div>
      <div>
        <b>BYTESMUSIC</b>
        <small>ADMIN PANEL</small>
      </div>
    </div>
    <nav class="snav">
      <button class="active" onclick="showPage('dashboard',this)"><span class="ico">⌂</span><span>Dashboard</span></button>
      <button onclick="showPage('users',this)"><span class="ico">◉</span><span>Users</span></button>
      <button onclick="showPage('songs',this)"><span class="ico">♪</span><span>Songs</span></button>
      <button onclick="showPage('activity',this)"><span class="ico">◷</span><span>Activity</span></button>
      <button onclick="showPage('likes',this)"><span class="ico">♡</span><span>Likes</span></button>
    </nav>
    <a href="/" class="sback">← Back to App</a>
  </aside>

  <div class="main">
    <header class="topbar">
      <h1 id="pageTitle">Dashboard</h1>
      <div class="spacer"></div>
      <div class="stat-pill"><span class="dot"></span> <span>System Online</span></div>
      <div class="admin-badge" id="adminName">Admin</div>
    </header>

    <div class="content">
      <!-- Dashboard -->
      <div class="page active" id="dashboard">
        <div class="stats" id="statCards"></div>
        <div class="chart">
          <h3>Plays — Last 7 Days</h3>
          <div class="bars" id="chartBars"></div>
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:24px">
          <div class="section">
            <h2>Most Played <span class="count" id="mpCount"></span></h2>
            <div class="table" id="mostPlayed"></div>
          </div>
          <div class="section">
            <h2>Most Liked <span class="count" id="mlCount"></span></h2>
            <div class="table" id="mostLiked"></div>
          </div>
        </div>
        <div class="section">
          <h2>Recent Activity</h2>
          <div class="table" id="recentAct"></div>
        </div>
      </div>

      <!-- Users -->
      <div class="page" id="users">
        <div class="section">
          <h2>All Users <span class="count" id="userCount"></span></h2>
          <div class="table" id="usersTable"></div>
        </div>
      </div>

      <!-- Songs -->
      <div class="page" id="songs">
        <div class="section">
          <h2>All Songs <span class="count" id="songCount"></span></h2>
          <div class="table" id="songsTable"></div>
        </div>
      </div>

      <!-- Activity -->
      <div class="page" id="activity">
        <div class="section">
          <h2>Play History <span class="count" id="actCount"></span></h2>
          <div class="table" id="actTable"></div>
        </div>
      </div>

      <!-- Likes -->
      <div class="page" id="likes">
        <div class="section">
          <h2>All Likes <span class="count" id="likeCount"></span></h2>
          <div class="table" id="likesTable"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
let adminToken = localStorage.getItem('bytesmusic_admin_token') || '';
let cachedActivity = null;

function esc(s) {
  return String(s || '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

const $ = id => document.getElementById(id);

function showPage(id, btn) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.snav button').forEach(b => b.classList.remove('active'));
  $(id).classList.add('active');
  if (btn) btn.classList.add('active');
  $('pageTitle').textContent = btn ? btn.querySelector('span:not(.ico)').textContent : 'Dashboard';
}

async function adminLogin() {
  let username = $('loginUser').value.trim();
  let password = $('loginPass').value;
  if (!username || !password) return $('loginMsg').textContent = 'Enter username and password.';
  let r = await fetch('/api/auth/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ username, password })
  });
  let d = await r.json();
  if (!r.ok) return $('loginMsg').textContent = d.error || 'Login failed.';
  if (d.is_admin !== 1) return $('loginMsg').textContent = 'This account does not have admin access.';
  adminToken = d.token;
  localStorage.setItem('bytesmusic_admin_token', d.token);
  enterPanel(d.username);
}

function enterPanel(username) {
  $('loginWrap').style.display = 'none';
  $('panel').style.display = 'grid';
  $('adminName').textContent = username || 'Admin';
  loadDashboard();
  loadUsers();
  loadActivity();
  loadLikes();
}

async function api(path) {
  let r = await fetch(path, { headers: { Authorization: 'Bearer ' + adminToken } });
  if (r.status === 403) {
    localStorage.removeItem('bytesmusic_admin_token');
    adminToken = '';
    location.reload();
    return null;
  }
  return r.json();
}

async function loadDashboard() {
  let d = await api('/api/admin/stats');
  if (!d) return;
  let cards = [
    { label: 'UNIQUE SONGS', value: d.songs, sub: 'distinct tracks played' },
    { label: 'USERS', value: d.users, sub: 'registered accounts' },
    { label: 'TOTAL PLAYS', value: d.plays, sub: 'all-time play count' },
    { label: 'TOTAL LIKES', value: d.likes, sub: 'songs liked' },
    { label: 'ARTISTS', value: d.artists, sub: 'unique artists' },
    { label: 'PLAYLISTS', value: d.playlists, sub: 'user playlists' },
  ];
  $('statCards').innerHTML = cards.map(c =>
    `<div class="stat"><div class="label">${c.label}</div><div class="value">${c.value}</div><div class="sub">${c.sub}</div></div>`
  ).join('');

  // 7-day chart
  let days = [];
  for (let i = 6; i >= 0; i--) {
    let date = new Date();
    date.setDate(date.getDate() - i);
    let label = date.toLocaleDateString('en', { weekday: 'short' });
    let dateStr = date.toISOString().slice(0, 10);
    let count = (d.recent || []).filter(r => (r.created_at || '').slice(0, 10) === dateStr).length;
    days.push({ label, count });
  }
  let maxVal = Math.max(...days.map(d => d.count), 1);
  $('chartBars').innerHTML = days.map(d =>
    `<div class="bar" style="height:${(d.count / maxVal) * 100}%" title="${d.label}: ${d.count} plays"><span class="tip">${d.count}</span></div>`
  ).join('');

  // Most played
  $('mpCount').textContent = `(${(d.most_played || []).length})`;
  $('mostPlayed').innerHTML = tableHTML(['#', 'Song', 'Artist', 'Plays'],
    (d.most_played || []).map((r, i) => [
      i + 1,
      `<div style="display:flex;gap:10px;align-items:center">${r.thumbnail ? `<img class="thumb" src="${esc(r.thumbnail)}" onerror="this.style.display='none'">` : ''}<span>${esc(r.title)}</span></div>`,
      esc(r.artist),
      r.plays
    ])
  );

  // Most liked
  $('mlCount').textContent = `(${(d.most_liked || []).length})`;
  $('mostLiked').innerHTML = tableHTML(['#', 'Song', 'Artist', 'Likes'],
    (d.most_liked || []).map((r, i) => [
      i + 1,
      `<div style="display:flex;gap:10px;align-items:center">${r.thumbnail ? `<img class="thumb" src="${esc(r.thumbnail)}" onerror="this.style.display='none'">` : ''}<span>${esc(r.title)}</span></div>`,
      esc(r.artist),
      r.likes
    ])
  );

  // Recent
  $('recentAct').innerHTML = tableHTML(['User', 'Song', 'Artist', 'Time'],
    (d.recent || []).slice(0, 15).map(r => [
      esc(r.username || 'Unknown'),
      `<div style="display:flex;gap:10px;align-items:center">${r.thumbnail ? `<img class="thumb" src="${esc(r.thumbnail)}" onerror="this.style.display='none'">` : ''}<span>${esc(r.title)}</span></div>`,
      esc(r.artist),
      `<span style="color:var(--text2);font-size:12px">${esc(r.created_at)}</span>`
    ])
  );
}

async function loadUsers() {
  let d = await api('/api/admin/users');
  if (!d) return;
  $('userCount').textContent = `(${(d.users || []).length})`;
  $('usersTable').innerHTML = tableHTML(['ID', 'Username', 'Email', 'Role', 'Joined', ''],
    (d.users || []).map(r => [
      r.id,
      `<div class="uname">${esc(r.username)}</div>`,
      `<div class="uemail">${esc(r.email)}</div>`,
      `<span class="badge ${r.is_admin === 1 ? 'admin' : 'user'}">${r.is_admin === 1 ? 'ADMIN' : 'USER'}</span>`,
      `<span style="color:var(--text2);font-size:12px">${esc(r.created_at)}</span>`,
      r.is_admin === 1
        ? `<button class="btn-del" disabled>Protected</button>`
        : `<button class="btn-del" onclick="deleteUser(${r.id})">Delete</button>`
    ])
  );
}

async function loadActivity() {
  let d = await api('/api/admin/activity');
  if (!d) return;
  cachedActivity = d;
  $('actCount').textContent = `(${(d.activity || []).length})`;
  $('actTable').innerHTML = tableHTML(['User', 'Song', 'Artist', 'Time'],
    (d.activity || []).map(r => [
      esc(r.username || 'Unknown'),
      `<div style="display:flex;gap:10px;align-items:center">${r.thumbnail ? `<img class="thumb" src="${esc(r.thumbnail)}" onerror="this.style.display='none'">` : ''}<span>${esc(r.title)}</span></div>`,
      esc(r.artist),
      `<span style="color:var(--text2);font-size:12px">${esc(r.created_at)}</span>`
    ])
  );
}

async function loadLikes() {
  let d = await api('/api/admin/likes');
  if (!d) return;
  $('likeCount').textContent = `(${(d.likes || []).length})`;
  $('likesTable').innerHTML = tableHTML(['User', 'Song', 'Artist', 'Time'],
    (d.likes || []).map(r => [
      esc(r.username || 'Unknown'),
      `<div style="display:flex;gap:10px;align-items:center">${r.thumbnail ? `<img class="thumb" src="${esc(r.thumbnail)}" onerror="this.style.display='none'">` : ''}<span>${esc(r.title)}</span></div>`,
      esc(r.artist),
      `<span style="color:var(--text2);font-size:12px">${esc(r.created_at)}</span>`
    ])
  );

  // Songs page: aggregate from the activity data already fetched in loadActivity
  let songs = {};
  (d.likes || []).forEach(r => {
    if (!songs[r.video_id]) songs[r.video_id] = { title: r.title, artist: r.artist, thumbnail: r.thumbnail, likes: 0, plays: 0 };
    songs[r.video_id].likes++;
  });
  if (cachedActivity) {
    (cachedActivity.activity || []).forEach(r => {
      if (!songs[r.video_id]) songs[r.video_id] = { title: r.title, artist: r.artist, thumbnail: r.thumbnail, likes: 0, plays: 0 };
      songs[r.video_id].plays++;
    });
  }
  let songList = Object.values(songs).sort((a, b) => b.plays + b.likes - a.plays - a.likes);
  $('songCount').textContent = `(${songList.length})`;
  $('songsTable').innerHTML = tableHTML(['Song', 'Artist', 'Plays', 'Likes'],
    songList.map(r => [
      `<div style="display:flex;gap:10px;align-items:center">${r.thumbnail ? `<img class="thumb" src="${esc(r.thumbnail)}" onerror="this.style.display='none'">` : ''}<span>${esc(r.title)}</span></div>`,
      esc(r.artist),
      r.plays,
      r.likes
    ])
  );
}

async function deleteUser(id) {
  if (!confirm('Delete this user and all their data? This cannot be undone.')) return;
  let r = await fetch('/api/admin/users/delete', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + adminToken },
    body: JSON.stringify({ userId: id })
  });
  let d = await r.json();
  if (d.ok) { loadUsers(); loadDashboard(); }
  else alert(d.error || 'Failed to delete user.');
}

function tableHTML(headers, rows) {
  let h = headers.map(x => `<th>${x}</th>`).join('');
  let b = rows.map(r => `<tr>${r.map(c => `<td>${c}</td>`).join('')}</tr>`).join('');
  return `<table><thead><tr>${h}</tr></thead><tbody>${b}</tbody></table>`;
}

// Auto-login if token exists
if (adminToken) {
  fetch('/api/auth/me', { headers: { Authorization: 'Bearer ' + adminToken } })
    .then(r => r.json())
    .then(d => {
      if (d.user && d.user.is_admin === 1) enterPanel(d.user.username);
      else { adminToken = ''; localStorage.removeItem('bytesmusic_admin_token'); }
    })
    .catch(() => { adminToken = ''; localStorage.removeItem('bytesmusic_admin_token'); });
}
</script>
</body>
</html>
